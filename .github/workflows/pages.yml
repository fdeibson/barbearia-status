# Modelo para o repositório PÚBLICO fdeibson/barbearia-status.
# Copiar para .github/workflows/pages.yml (ver status-page/README.md).
#
# Publica o site quando uma PESSOA faz push (mudança de layout, nota manual de
# incidente em site/data/incidents-manual.json, novo serviço). As rodadas do
# monitor já publicam sozinhas em monitor.yml. Também roda os testes do monitor.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "monitor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Testes do monitor
        run: node --test monitor/lib.test.mjs
      - name: Validar JSON dos dados
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("monitor/services.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("site/data/incidents-manual.json","utf8"))'
          if [ -f site/data/status.json ]; then node -e 'JSON.parse(require("fs").readFileSync("site/data/status.json","utf8"))'; fi

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
